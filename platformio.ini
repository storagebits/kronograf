; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = twatch-v1
src_dir = src

[env]
platform = espressif32@6.9.0
board = ttgo-t-watch
framework = arduino
board_build.partitions = partitions_16MB.csv
board_build.f_flash = 80000000L
board_build.flash_mode = qio
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 230400
extra_scripts =
	pre:tools/ld_ringbuf_flash.py
	post:tools/archive_elf.py
lib_deps =
	lvgl=symlink://lib/lvgl
	lewisxhe/XPowersLib@0.2.6
	lewisxhe/SensorLib@0.2.0
	h2zero/NimBLE-Arduino@2.5.1
build_src_filter = +<*> -<hal/sim/>
build_flags = 
	-I include
	-D LV_CONF_INCLUDE_SIMPLE
	-D BOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
	-D CORE_DEBUG_LEVEL=2
	; NimBLE: a single connection, host in PSRAM, logs off (scanning kept for the toolbox)
	-D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
	-D CONFIG_BT_NIMBLE_MAX_BONDS=2
	-D CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=1
	-D CONFIG_NIMBLE_CPP_LOG_LEVEL=0
	-D CONFIG_BT_NIMBLE_LOG_LEVEL=0

[env:twatch-v1]
build_flags = ${env.build_flags} -D KG_BOARD_V1

[env:twatch-v2]
build_flags = ${env.build_flags} -D KG_BOARD_V2

[env:twatch-v3]
build_flags = ${env.build_flags} -D KG_BOARD_V3

; Over-the-air update in workshop mode (watch on USB, Wi-Fi configured):
;   pio run -e twatch-v1-ota -t upload
[env:twatch-v1-ota]
extends = env:twatch-v1
upload_protocol = espota
upload_port = kronograf.local
